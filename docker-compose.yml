# Production-style stack: Postgres + API + web behind Caddy (automatic HTTPS).
# Usage: cp backend/.env.example backend/.env and set SECRET_KEY (+ AI keys), then:
#   DOMAIN=feedback.example.com POSTGRES_PASSWORD=<strong password> docker compose up -d --build
# The API refuses to start in production with a missing or placeholder SECRET_KEY.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loopwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: loopwise
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopwise"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://loopwise:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/loopwise
      PUBLIC_APP_URL: https://${DOMAIN:-localhost}
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      OUTBOX_DIR: /data/outbox
    volumes: [outbox:/data/outbox]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  pgdata:
  outbox:
  caddy_data:
  caddy_config:
